<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>DÉPANNAGE.DZ</title>

<link
    rel="stylesheet"
    href="https://unpkg.com"
/>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#f4f6f8;
    color:#17202a;
    min-height:100vh;
}

header{
    background:#111827;
    color:white;
    padding:18px 16px;
    text-align:center;
    position:relative;
}

header h1{
    font-size:25px;
    letter-spacing:.5px;
}

header p{
    margin-top:5px;
    color:#cbd5e1;
    font-size:13px;
}

.account-btn{
    position:absolute;
    right:12px;
    top:13px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:50%;
    width:48px;
    height:48px;
    font-size:21px;
    box-shadow:0 3px 8px #0004;
    cursor:pointer;
}

.account-btn:active{
    transform:scale(.95);
}

.sos{
    position:absolute;
    left:12px;
    top:13px;
    background:#dc2626;
    color:white;
    border:0;
    border-radius:50%;
    width:48px;
    height:48px;
    font-size:22px;
    box-shadow:0 3px 8px #0004;
}

.container{
    padding:15px;
    padding-bottom:90px;
}

.section-title{
    font-size:18px;
    font-weight:bold;
    margin:12px 0;
}

.services{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.card{
    background:white;
    border-radius:18px;
    padding:18px 10px;
    text-align:center;
    box-shadow:0 3px 12px #00000012;
    border:1px solid #e5e7eb;
    min-height:130px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.card:active{
    transform:scale(.97);
}

.card .icon{
    font-size:38px;
    margin-bottom:9px;
}

.card h3{
    font-size:16px;
}

.card p{
    color:#64748b;
    font-size:12px;
    margin-top:5px;
}

.map{
    margin-top:18px;
    height:320px;
    background:#dbe7d1;
    border-radius:18px;
    position:relative;
    overflow:hidden;
    border:1px solid #d1d5db;
    z-index:1;
}

#realMap{
    width:100%;
    height:100%;
    min-height:320px;
}

.leaflet-container{
    width:100%;
    height:100%;
    font-family:Arial,Tahoma,sans-serif;
}

.map-status{
    position:absolute;
    top:10px;
    right:10px;
    left:10px;
    z-index:500;
    background:#ffffffee;
    padding:9px;
    border-radius:10px;
    text-align:center;
    font-size:12px;
    box-shadow:0 2px 8px #0002;
    pointer-events:none;
}

#locationText{
    position:absolute;
    bottom:10px;
    right:10px;
    left:10px;
    z-index:500;
    background:#ffffffee;
    padding:8px;
    border-radius:10px;
    text-align:center;
    font-size:12px;
    box-shadow:0 2px 8px #0002;
    pointer-events:none;
}

.providers{
    margin-top:18px;
    display:none;
}

.provider{
    background:white;
    border-radius:16px;
    padding:15px;
    margin-bottom:11px;
    box-shadow:0 3px 10px #00000012;
    border:1px solid #e5e7eb;
}

.provider.busy{
    background:#fff1f2;
    border:2px solid #ef4444;
}

.provider-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.provider h3{
    font-size:16px;
}

.badge{
    background:#e0f2fe;
    color:#0369a1;
    padding:5px 8px;
    border-radius:8px;
    font-size:11px;
    white-space:nowrap;
}

.busy-badge{
    background:#dc2626;
    color:white;
    padding:6px 9px;
    border-radius:8px;
    font-size:11px;
    white-space:nowrap;
    display:inline-block;
    margin-top:8px;
}

.available-badge{
    background:#dcfce7;
    color:#15803d;
    padding:5px 9px;
    border-radius:8px;
    font-size:11px;
    display:inline-block;
    margin-top:8px;
}

.provider-info{
    color:#64748b;
    font-size:13px;
    margin-top:8px;
    line-height:1.8;
}

.call-btn{
    width:100%;
    border:0;
    background:#16a34a;
    color:white;
    padding:12px;
    border-radius:11px;
    margin-top:10px;
    font-size:15px;
    font-weight:bold;
}

.back-btn{
    width:100%;
    border:0;
    background:#e5e7eb;
    color:#111827;
    padding:12px;
    border-radius:11px;
    margin-bottom:10px;
    font-size:14px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    right:0;
    left:0;
    height:65px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:20;
}

.bottom-nav button{
    border:0;
    background:none;
    font-size:12px;
    color:#475569;
    cursor:pointer;
}

.bottom-nav span{
    display:block;
    font-size:22px;
    margin-bottom:3px;
}

.modal-bg{
    position:fixed;
    inset:0;
    background:#0008;
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:1000;
}

.modal{
    background:white;
    width:100%;
    max-width:550px;
    border-radius:24px 24px 0 0;
    padding:22px 17px 28px;
    max-height:90vh;
    overflow-y:auto;
}

.modal h2{
    font-size:20px;
    margin-bottom:8px;
}

.modal p{
    color:#64748b;
    font-size:13px;
    margin-bottom:15px;
}

.option{
    width:100%;
    padding:15px;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:13px;
    margin-bottom:9px;
    text-align:right;
    font-size:15px;
    cursor:pointer;
}

.option:active{
    background:#e2e8f0;
}

.close{
    width:100%;
    border:0;
    background:#e5e7eb;
    padding:12px;
    border-radius:12px;
    margin-top:7px;
    font-size:15px;
    cursor:pointer;
}

input,select,textarea{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:11px;
    margin-top:7px;
    margin-bottom:12px;
    font-size:15px;
    background:white;
}

textarea{
    min-height:100px;
    resize:vertical;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:#334155;
}

.primary{
    width:100%;
    background:#2563eb;
    color:white;
    border:0;
    padding:13px;
    border-radius:11px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.location-btn{
    width:100%;
    background:#16a34a;
    color:white;
    border:0;
    padding:13px;
    border-radius:11px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:3px;
}

.location-status{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:9px;
    margin:8px 0 12px;
    font-size:12px;
    color:#64748b;
    line-height:1.6;
}

.location-status.success{
    background:#f0fdf4;
    border-color:#bbf7d0;
    color:#15803d;
}

.step-title{
    background:#eff6ff;
    color:#1d4ed8;
    padding:10px;
    border-radius:10px;
    margin:10px 0 14px;
    font-size:13px;
    font-weight:bold;
}

.toast{
    position:fixed;
    bottom:78px;
    right:15px;
    left:15px;
    background:#111827;
    color:white;
    padding:13px;
    border-radius:12px;
    text-align:center;
    display:none;
    z-index:2000;
    font-size:14px;
}

.account-profile{
    background:#eff6ff;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
    border:1px solid #dbeafe;
}

.account-profile .avatar{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    margin:0 auto 10px;
}

.account-profile h3{
    text-align:center;
    font-size:18px;
    margin-bottom:5px;
}

.account-profile p{
    text-align:center;
    margin:3px 0;
    color:#475569;
}

.logout-btn{
    width:100%;
    border:0;
    background:#dc2626;
    color:white;
    padding:13px;
    border-radius:11px;
    margin-top:8px;
    font-size:15px;
    font-weight:bold;
}

.account-choice{
    width:100%;
    padding:16px;
    border:1px solid #e2e8f0;
    background:#f8fafc;
    border-radius:13px;
    margin-bottom:10px;
    text-align:right;
    font-size:15px;
}

.account-role{
    background:#e0f2fe;
    color:#0369a1;
    padding:5px 9px;
    border-radius:8px;
    display:inline-block;
    font-size:12px;
    margin-top:5px;
}
</style>
</head>
<body>

<!-- واجهة التطبيق الرئيسية (مخفية في البداية لتعرض صفحة دخول السائق أولاً) -->
<div id="mainApp" style="display: none;">
    <header>
        <button class="sos">🚨</button>
        <h1>DÉPANNAGE.DZ</h1>
        <p>خدمات السحب والمساعدة على الطريق في الجزائر</p>
        <button class="account-btn" onclick="openProfile()">👤</button>
    </header>

    <div class="container">
        <div class="section-title">اختر الخدمة المطلوبة</div>
        <div class="services">
            <div class="card" onclick="openService('سحب السيارات')">
                <div class="icon">🛞</div>
                <h3>شاحنة قطر</h3>
                <p>نقل وسحب السيارات المعطلة</p>
            </div>
            <div class="card" onclick="openService('إصلاح العجلات')">
                <div class="icon">🔧</div>
                <h3>إصلاح عجلات</h3>
                <p>تغيير وإصلاح الإطارات</p>
            </div>
        </div>
        <div class="map">
            <div class="map-status">جاري تحديد موقعك الحالي بدقة...</div>
            <div id="realMap"></div>
            <div id="locationText">الموقع الحالي: غير محدد</div>
        </div>
    </div>
</div>

<!-- صفحة دخول السائق (تظهر أولاً) -->
<div id="driverLoginPage" style="padding: 20px; max-width: 500px; margin: 40px auto; background: white; border-radius: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <h2 style="margin-bottom: 15px; text-align: center;">تسجيل دخول السائق</h2>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 20px; text-align: center;">الرجاء إدخال بياناتك للوصول إلى لوحة التحكم واستقبال الطلبات</p>
    
    <label for="driverPhone">رقم الهاتف:</label>
    <input type="tel" id="driverPhone" placeholder="0500000000" required>
