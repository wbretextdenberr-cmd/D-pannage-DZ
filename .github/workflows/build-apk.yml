name: Build DÉPANNAGE.DZ HTML APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project
        run: |
          echo "Checking DÉPANNAGE.DZ project..."
          find html-app -maxdepth 8 -type f | sort

      - name: Build Debug APK
        working-directory: html-app
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: D-pannage-DZ-HTML-APK
          path: html-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
